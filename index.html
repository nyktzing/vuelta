<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Día de la Independencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #D52B1E 33%, #FFFFFF 33% 66%, #0038A8 66%);
      overflow: hidden;
      position: relative;
      color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    #contador {
      font-size: 4rem;
      text-align: center;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.7);
      padding: 20px;
      border-radius: 15px;
    }

    .emoji {
      position: absolute;
      font-size: 2rem;
      animation: float 10s infinite linear;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); }
      100% { transform: translateY(-10vh) translateX(0); }
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.7);
      text-align: center;
      padding: 10px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div id="contador">
  <div><strong>Faltan:</strong></div>
  <div id="dias"></div>
  <div id="tiempo"></div>
</div>

<footer>
  "Todo pasa, sigue adelante."
  <br>
  "Eres más fuerte de lo que crees."
</footer>

<script>
  // Emojis flotantes
  const emojis = ['🎉', '🇵🇾', '🎈', '✨', '🎊', '🥳'];
  for (let i = 0; i < 20; i++) {
    const emoji = document.createElement('div');
    emoji.className = 'emoji';
    emoji.style.left = Math.random() * 100 + 'vw';
    emoji.style.animationDuration = (5 + Math.random() * 5) + 's';
    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    document.body.appendChild(emoji);
  }

  // Contador
  const fechaObjetivo = new Date('2025-05-14T00:00:00');

  function actualizarContador() {
    const ahora = new Date();
    const diferencia = fechaObjetivo - ahora;

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

    document.getElementById('dias').textContent = dias + " días";
    document.getElementById('tiempo').textContent = `${horas.toString().padStart(2,'0')}:${minutos.toString().padStart(2,'0')}:${segundos.toString().padStart(2,'0')}`;
  }

  actualizarContador();
  setInterval(actualizarContador, 1000);
</script>

</body>
</html>
